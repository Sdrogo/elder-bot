services:
  elder-bot:
    build: .
    image: elder-bot
    env_file: .env
    environment:
      DATABASE_PATH: /data/elder-bot.db
    volumes:
      - elder-bot-data:/data
    restart: unless-stopped
    # Hardening: only /data is writable, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    # Without rotation the logs grow until the VPS disk is full.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  elder-bot-data:
