<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ElderBot</title>
    <link rel="stylesheet" href="/panel.css?v=37" />
    <script src="/app.js?v=37" defer></script>
  </head>
  <body data-page="login">
    <main class="login">
      <h1>ElderBot</h1>
      <p data-t="login.intro">I tuoi personaggi e le tue Cronache di Vampire: The Masquerade.</p>
      <p class="error" data-t="login.failed" hidden>Accesso non riuscito. Riprova.</p>
      <a class="button discord" href="/login" data-t="login.button">Accedi con Discord</a>
      <p class="note" data-t="login.note">
        Il bot legge solo il tuo ID e il tuo nome su Discord, nient'altro.
      </p>
    </main>
  </body>
</html>
