<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ElderBot</title>
    <link rel="stylesheet" href="/panel.css?v=34" />
    <script src="/overlay/static/common.js?v=34" defer></script>
    <script src="/app.js?v=34" defer></script>
  </head>
  <body data-page="panel">
    <header class="top">
      <h1>ElderBot</h1>
      <span id="user"></span>
      <button id="logout" type="button" data-t="logout">Esci</button>
    </header>
    <main>
      <p class="notice" id="notice" role="status" hidden></p>
      <section>
        <div class="section-head">
          <h2 data-t="characters.title">I miei personaggi</h2>
          <button id="new-character" type="button" data-t="characters.new">
            Nuovo personaggio
          </button>
        </div>
        <div id="new-character-slot"></div>
        <p class="empty" id="characters-empty" data-t="characters.empty" hidden>
          Non hai ancora personaggi.
        </p>
        <div class="cards" id="characters"></div>
      </section>
      <section id="chronicles-section">
        <div class="section-head">
          <h2 data-t="chronicles.title">Le mie Cronache</h2>
          <button id="new-chronicle" type="button" data-t="chronicles.new">Nuova Cronaca</button>
        </div>
        <div id="new-chronicle-slot"></div>
        <p class="empty" id="chronicles-empty" data-t="chronicles.empty" hidden>
          Non sei Narratore di nessuna Cronaca.
        </p>
        <div id="chronicles"></div>
        <div id="overlay"></div>
      </section>
    </main>
  </body>
</html>
